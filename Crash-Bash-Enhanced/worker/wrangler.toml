name = "crash-bash-online-lobby"
main = "src/index.js"
compatibility_date = "2026-11-21"
workers_dev = true

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "CrashBashLobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CrashBashLobby"]

[observability]
enabled = true

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/health", "/v1/*"]
