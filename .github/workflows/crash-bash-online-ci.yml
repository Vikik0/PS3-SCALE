name: Crash Bash Enhanced CI

on:
  push:
    branches:
      - feature/crash-bash-online-enhanced-0.1
    paths:
      - "Crash-Bash-Enhanced/**"
      - ".github/workflows/crash-bash-online-ci.yml"
  pull_request:
    paths:
      - "Crash-Bash-Enhanced/**"
      - ".github/workflows/crash-bash-online-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Crash-Bash-Enhanced/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Crash-Bash-Enhanced/web/package.json
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Build production web lobby
        run: npm run build

  lobby-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Crash-Bash-Enhanced/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Crash-Bash-Enhanced/worker/package.json
      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund
      - name: Run matchmaking integration tests
        run: npm test
      - name: Validate Cloudflare Worker bundle without deployment
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/crash-bash-worker-dist"

  ps3-input-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xz-utils libgmp10 libssl3 zlib1g
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/crashbash-ps3-stage/ps3dev/ppu
          key: crashbash-ps3dk-ppu-v0.27.0-${{ runner.os }}-x86_64
      - name: Download pinned PS3DK PPU toolchain
        shell: bash
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/crashbash-ps3-stage"
          ps3dev="$stage/ps3dev"
          mkdir -p "$ps3dev"
          if [ ! -x "$ps3dev/ppu/bin/powerpc64-ps3-elf-gcc" ]; then
            curl -fL --retry 3 \
              https://github.com/FirebirdTA01/PS3DK/releases/download/v0.27.0/ps3dev-ppu.tar.xz \
              -o "$RUNNER_TEMP/crashbash-ps3dev-ppu.tar.xz"
            tar -xJf "$RUNNER_TEMP/crashbash-ps3dev-ppu.tar.xz" -C "$stage"
          fi
          test -x "$ps3dev/ppu/bin/powerpc64-ps3-elf-gcc"
          echo "PS3DEV=$ps3dev" >> "$GITHUB_ENV"
          echo "PS3DK=$ps3dev/ps3dk" >> "$GITHUB_ENV"
      - name: Download pinned PS3DK host tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/crashbash-ps3-host-tools"
          curl -fL --retry 3 \
            https://github.com/FirebirdTA01/PS3DK/releases/download/v0.27.0/ps3-sdk-tools-v0.27.0-linux-x86_64.tar.xz \
            -o "$RUNNER_TEMP/crashbash-ps3-host-tools.tar.xz"
          tar -xJf "$RUNNER_TEMP/crashbash-ps3-host-tools.tar.xz" -C "$RUNNER_TEMP/crashbash-ps3-host-tools"
          tool_bin="$(find "$RUNNER_TEMP/crashbash-ps3-host-tools" -type f -name prx-gen -printf '%h\n' -quit)"
          test -n "$tool_bin"
          mkdir -p "$PS3DEV/bin"
          cp -a "$tool_bin/." "$PS3DEV/bin/"
          chmod +x "$PS3DEV/bin/prx-gen" "$PS3DEV/bin/fself"
          "$PS3DEV/bin/prx-gen" --version
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare PS3 SDK headers, import stubs and PRX runtime
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/crashbash-PS3DK-src"
          git clone --depth 1 --branch v0.27.0 https://github.com/FirebirdTA01/PS3DK.git "$src"
          mkdir -p "$PS3DK/ppu/lib" "$PS3DK/ppu/include"
          cp -a "$PS3DEV/ppu/include/." "$PS3DK/ppu/include/"
          mkdir -p "$src/sdk/include/lv2" "$src/sdk/include/sys"
          cp -a "$src/tests/sdk/lv2syscall-fixture/legacy-psl1ght/lv2/." "$src/sdk/include/lv2/"
          cp "$src/tests/sdk/lv2syscall-fixture/legacy-psl1ght/ppu-lv2.h" "$src/sdk/include/ppu-lv2.h"
          cp Crash-Bash-Enhanced/ps3/compat/lv2/sysfs.h "$src/sdk/include/lv2/sysfs.h"
          cp Crash-Bash-Enhanced/ps3/compat/lv2/spinlock.h "$src/sdk/include/lv2/spinlock.h"
          cp Crash-Bash-Enhanced/ps3/compat/sys/lv2errno.h "$src/sdk/include/sys/lv2errno.h"
          cp Crash-Bash-Enhanced/ps3/compat/sys/systime.h "$src/sdk/include/sys/systime.h"
          python3 - "$src/scripts/build-runtime-lv2.sh" <<'PY'
          from pathlib import Path
          import sys
          script = Path(sys.argv[1])
          source = script.read_text()
          needle = 'make -C "$PS3_TOOLCHAIN_ROOT/sdk" install-headers >/dev/null'
          addition = needle + chr(10) + chr(10).join([
              'mkdir -p "$PS3DK/ppu/include/lv2" "$PS3DK/ppu/include/sys"',
              'cp "$PS3_TOOLCHAIN_ROOT/sdk/include/lv2/sysfs.h" "$PS3DK/ppu/include/lv2/sysfs.h"',
              'cp "$PS3_TOOLCHAIN_ROOT/sdk/include/lv2/spinlock.h" "$PS3DK/ppu/include/lv2/spinlock.h"',
              'cp "$PS3_TOOLCHAIN_ROOT/sdk/include/lv2/process.h" "$PS3DK/ppu/include/lv2/process.h"',
              'cp "$PS3_TOOLCHAIN_ROOT/sdk/include/lv2/syscalls.h" "$PS3DK/ppu/include/lv2/syscalls.h"',
              'cp "$PS3_TOOLCHAIN_ROOT/sdk/include/lv2/systime.h" "$PS3DK/ppu/include/lv2/systime.h"',
              'cp "$PS3_TOOLCHAIN_ROOT/sdk/include/ppu-lv2.h" "$PS3DK/ppu/include/ppu-lv2.h"',
              'cp "$PS3_TOOLCHAIN_ROOT/sdk/include/sys/lv2errno.h" "$PS3DK/ppu/include/sys/lv2errno.h"',
              'cp "$PS3_TOOLCHAIN_ROOT/sdk/include/sys/systime.h" "$PS3DK/ppu/include/sys/systime.h"'
          ])
          if needle not in source:
              raise SystemExit("Could not locate PS3DK runtime header installation step")
          script.write_text(source.replace(needle, addition, 1))
          PY
          PS3DEV="$PS3DEV" PS3DK="$PS3DK" PS3_TOOLCHAIN_ROOT="$src" \
            bash "$src/scripts/build-runtime-lv2.sh"
          CARGO_TARGET_DIR="$src/tools/target" cargo build --release --manifest-path "$src/tools/nidgen/Cargo.toml"
          nidgen="$src/tools/target/release/nidgen"
          test -x "$nidgen"
          mkdir -p "$RUNNER_TEMP/crashbash-ps3-stubs"
          for stub in io net netctl lv2 sysmodule fs libc; do
            out="$RUNNER_TEMP/crashbash-ps3-stubs/$stub"
            mkdir -p "$out"
            "$nidgen" archive \
              --input "$src/tools/nidgen/nids/extracted/lib${stub}_stub.yaml" \
              --toolchain-bin "$PS3DEV/ppu/bin" \
              --out-dir "$out" \
              --abi ilp32
            archive="$(find "$out" -type f -name "lib${stub}_stub.a" -print -quit)"
            test -n "$archive"
            if [ "$stub" = "net" ]; then
              PS3DEV="$PS3DEV" PS3DK="$PS3DK" PS3_TOOLCHAIN_ROOT="$src" \
                bash "$src/scripts/build-libnet-archive.sh" \
                "$archive" "$PS3DK/ppu/lib/libnet_stub.a" ilp32
            else
              cp "$archive" "$PS3DK/ppu/lib/lib${stub}_stub.a"
            fi
          done
          test -f "$PS3DK/ppu/include/cell/pad.h"
          for stub in io net netctl lv2 sysmodule fs libc; do
            test -f "$PS3DK/ppu/lib/lib${stub}_stub.a"
          done
      - name: Build Crash Bash PS3 input bridge
        run: make -C Crash-Bash-Enhanced/ps3 PS3DEV="$PS3DEV" PS3DK="$PS3DK"
      - uses: actions/upload-artifact@v6
        with:
          name: crash-bash-ps3-input-bridge
          path: |
            Crash-Bash-Enhanced/ps3/build/crash_bash_input.prx
            Crash-Bash-Enhanced/ps3/build/crash_bash_input.fake.sprx
            Crash-Bash-Enhanced/ps3/build/crash_bash_input.elf
