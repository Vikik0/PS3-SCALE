name: Crash Bash Enhanced CI

on:
  push:
    branches:
      - feature/crash-bash-online-enhanced-0.1
    paths:
      - "Crash-Bash-Enhanced/**"
      - ".github/workflows/crash-bash-online-ci.yml"
  pull_request:
    paths:
      - "Crash-Bash-Enhanced/**"
      - ".github/workflows/crash-bash-online-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Crash-Bash-Enhanced/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Crash-Bash-Enhanced/web/package.json
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Run browser CBN1 protocol tests
        run: npm test
      - name: Check browser player script syntax
        run: node --check public/play.js
      - name: Test PS1-to-libretro controller mapping
        run: npm test
      - name: Build production web lobby
        run: npm run build
      - name: Verify browser player files are included in the production bundle
        run: test -s dist/play.html && test -s dist/play.js && test -s dist/pad-bridge.js

  lobby-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Crash-Bash-Enhanced/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Crash-Bash-Enhanced/worker/package.json
      - name: Install web dependencies for the Worker asset bundle
        working-directory: Crash-Bash-Enhanced/web
        run: npm install --no-audit --no-fund
      - name: Build static lobby assets for Cloudflare Workers
        working-directory: Crash-Bash-Enhanced/web
        run: npm run build
      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund
      - name: Run matchmaking integration tests
        run: npm test
      - name: Validate Worker and static asset bundle without deployment
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/crash-bash-worker-dist"

  websocket-client-host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile and test the WebSocket client against a local RFC 6455 server
        run: bash Crash-Bash-Enhanced/ps3/tests/run_ws_client_test.sh

  ps3-input-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xz-utils libgmp10 libssl3 zlib1g ca-certificates
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/crashbash-ps3-stage/ps3dev/ppu
          key: crashbash-ps3dk-ppu-v0.27.0-${{ runner.os }}-x86_64
      - name: Download pinned PS3DK PPU toolchain
        shell: bash
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/crashbash-ps3-stage"
          ps3dev="$stage/ps3dev"
          mkdir -p "$ps3dev"
          if [ ! -x "$ps3dev/ppu/bin/powerpc64-ps3-elf-gcc" ]; then
            curl -fL --retry 3 \
              https://github.com/FirebirdTA01/PS3DK/releases/download/v0.27.0/ps3dev-ppu.tar.xz \
              -o "$RUNNER_TEMP/crashbash-ps3dev-ppu.tar.xz"
            tar -xJf "$RUNNER_TEMP/crashbash-ps3dev-ppu.tar.xz" -C "$stage"
          fi
          test -x "$ps3dev/ppu/bin/powerpc64-ps3-elf-gcc"
          echo "PS3DEV=$ps3dev" >> "$GITHUB_ENV"
          echo "PS3DK=$ps3dev/ps3dk" >> "$GITHUB_ENV"
      - name: Download pinned PS3DK host tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/crashbash-ps3-host-tools"
          curl -fL --retry 3 \
            https://github.com/FirebirdTA01/PS3DK/releases/download/v0.27.0/ps3-sdk-tools-v0.27.0-linux-x86_64.tar.xz \
            -o "$RUNNER_TEMP/crashbash-ps3-host-tools.tar.xz"
          tar -xJf "$RUNNER_TEMP/crashbash-ps3-host-tools.tar.xz" -C "$RUNNER_TEMP/crashbash-ps3-host-tools"
          tool_bin="$(find "$RUNNER_TEMP/crashbash-ps3-host-tools" -type f -name prx-gen -printf '%h\n' -quit)"
          test -n "$tool_bin"
          mkdir -p "$PS3DEV/bin"
          cp -a "$tool_bin/." "$PS3DEV/bin/"
          chmod +x "$PS3DEV/bin/prx-gen" "$PS3DEV/bin/fself"
          "$PS3DEV/bin/prx-gen" --version
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare PS3 SDK headers, import stubs and PRX runtime
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/crashbash-PS3DK-src"
          git clone --depth 1 --branch v0.27.0 https://github.com/FirebirdTA01/PS3DK.git "$src"
          mkdir -p "$PS3DK/ppu/lib" "$PS3DK/ppu/include"
          cp -a "$PS3DEV/ppu/include/." "$PS3DK/ppu/include/"
          mkdir -p "$src/sdk/include/lv2" "$src/sdk/include/sys"
          cp -a "$src/tests/sdk/lv2syscall-fixture/legacy-psl1ght/lv2/." "$src/sdk/include/lv2/"
          cp "$src/tests/sdk/lv2syscall-fixture/legacy-psl1ght/ppu-lv2.h" "$src/sdk/include/ppu-lv2.h"
          cp Crash-Bash-Enhanced/ps3/compat/lv2/sysfs.h "$src/sdk/include/lv2/sysfs.h"
          cp Crash-Bash-Enhanced/ps3/compat/lv2/spinlock.h "$src/sdk/include/lv2/spinlock.h"
          cp Crash-Bash-Enhanced/ps3/compat/lv2/thread.h "$src/sdk/include/lv2/thread.h"
          cp Crash-Bash-Enhanced/ps3/compat/sys/lv2errno.h "$src/sdk/include/sys/lv2errno.h"
          cp Crash-Bash-Enhanced/ps3/compat/sys/systime.h "$src/sdk/include/sys/systime.h"
          python3 - "$src/scripts/build-runtime-lv2.sh" <<'PY'
          from pathlib import Path
          import sys
          script = Path(sys.argv[1])
          source = script.read_text()
          needle = 'make -C "$PS3_TOOLCHAIN_ROOT/sdk" install-headers >/dev/null'
          addition = needle + chr(10) + chr(10).join([
              'mkdir -p "$PS3DK/ppu/include/lv2" "$PS3DK/ppu/include/sys"',
              'cp "$PS3_TOOLCHAIN_ROOT/sdk/include/lv2/sysfs.h" "$PS3DK/ppu/include/lv2/sysfs.h"',
              'cp "$PS3_TOOLCHAIN_ROOT/sdk/include/lv2/spinlock.h" "$PS3DK/ppu/include/lv2/spinlock.h"',
              'cp "$PS3_TOOLCHAIN_ROOT/sdk/include/lv2/thread.h" "$PS3DK/ppu/include/lv2/thread.h"',
              'cp "$PS3_TOOLCHAIN_ROOT/sdk/include/lv2/process.h" "$PS3DK/ppu/include/lv2/process.h"',
              'cp "$PS3_TOOLCHAIN_ROOT/sdk/include/lv2/syscalls.h" "$PS3DK/ppu/include/lv2/syscalls.h"',
              'cp "$PS3_TOOLCHAIN_ROOT/sdk/include/lv2/systime.h" "$PS3DK/ppu/include/lv2/systime.h"',
              'cp "$PS3_TOOLCHAIN_ROOT/sdk/include/ppu-lv2.h" "$PS3DK/ppu/include/ppu-lv2.h"',
              'cp "$PS3_TOOLCHAIN_ROOT/sdk/include/sys/lv2errno.h" "$PS3DK/ppu/include/sys/lv2errno.h"',
              'cp "$PS3_TOOLCHAIN_ROOT/sdk/include/sys/systime.h" "$PS3DK/ppu/include/sys/systime.h"'
          ])
          if needle not in source:
              raise SystemExit("Could not locate PS3DK runtime header installation step")
          script.write_text(source.replace(needle, addition, 1))
          PY
          PS3DEV="$PS3DEV" PS3DK="$PS3DK" PS3_TOOLCHAIN_ROOT="$src" \
            bash "$src/scripts/build-runtime-lv2.sh"
          "$PS3DEV/ppu/bin/powerpc64-ps3-elf-gcc" -O2 -mcpu=cell \
            -ffunction-sections -fdata-sections \
            -I"$PS3DK/ppu/include" \
            -c "$src/runtime/lv2/crt/crt1.c" \
            -o "$PS3DK/ppu/lib/lv2-prx-crt1.o"
          CARGO_TARGET_DIR="$src/tools/target" cargo build --release --manifest-path "$src/tools/nidgen/Cargo.toml"
          nidgen="$src/tools/target/release/nidgen"
          test -x "$nidgen"
          mkdir -p "$RUNNER_TEMP/crashbash-ps3-stubs"
          for stub in io net netctl lv2 sysmodule sysutil fs c; do
            out="$RUNNER_TEMP/crashbash-ps3-stubs/$stub"
            mkdir -p "$out"
            "$nidgen" archive \
              --input "$src/tools/nidgen/nids/extracted/lib${stub}_stub.yaml" \
              --toolchain-bin "$PS3DEV/ppu/bin" \
              --out-dir "$out" \
              --abi ilp32
            archive_name="lib${stub}_stub.a"
            if [ "$stub" = "fs" ]; then
              archive_name="libsys_fs_stub.a"
            fi
            archive="$(find "$out" -type f -name "$archive_name" -print -quit)"
            test -n "$archive"
            if [ "$stub" = "net" ]; then
              PS3DEV="$PS3DEV" PS3DK="$PS3DK" PS3_TOOLCHAIN_ROOT="$src" \
                bash "$src/scripts/build-libnet-archive.sh" \
                "$archive" "$PS3DK/ppu/lib/libnet_stub.a" ilp32
            else
              cp "$archive" "$PS3DK/ppu/lib/lib${stub}_stub.a"
            fi
          done
          test -f "$PS3DK/ppu/include/cell/pad.h"
          for stub in io net netctl lv2 sysmodule fs c; do
            test -f "$PS3DK/ppu/lib/lib${stub}_stub.a"
          done
      - name: Build pinned mbedTLS 2.28.10 for PS3
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2.28.10 https://github.com/Mbed-TLS/mbedtls.git "$RUNNER_TEMP/crashbash-mbedtls"
          CC="$PS3DEV/ppu/bin/powerpc64-ps3-elf-gcc" \
          AR="$PS3DEV/ppu/bin/powerpc64-ps3-elf-ar" \
          RANLIB="$PS3DEV/ppu/bin/powerpc64-ps3-elf-ranlib" \
          CFLAGS="-O2 -mcpu=cell -mhard-float -ffunction-sections -fdata-sections -fno-stack-protector -fno-builtin" \
            bash Crash-Bash-Enhanced/ps3/build-mbedtls.sh \
            "$RUNNER_TEMP/crashbash-mbedtls" \
            Crash-Bash-Enhanced/ps3/build/mbedtls
      - name: Build Crash Bash PS3 input bridge
        run: make -C Crash-Bash-Enhanced/ps3 PS3DEV="$PS3DEV" PS3DK="$PS3DK"
      - name: Build installable Crash Bash Online PKG
        shell: bash
        run: |
          set -euo pipefail
          pkg_files="$PWD/Crash-Bash-Enhanced/ps3/build/pkg_files"
          mkdir -p "$pkg_files/USRDIR"
          cp -a Crash-Bash-Enhanced/ps3/installer/pkg_files/USRDIR/. "$pkg_files/USRDIR/"
          cp Crash-Bash-Enhanced/ps3/build/crash_bash_input.fake.sprx "$pkg_files/USRDIR/"
          cp Crash-Bash-Enhanced/ps3/build/loader/crash_bash_loader.fake.sprx "$pkg_files/USRDIR/"
          crtn_object="$PS3DK/ppu/lib/lv2-crtn.o"
          gcc_crt_dir="$PS3DEV/ppu/powerpc64-ps3-elf/lib"
          mkdir -p "$PS3DK/ppu/lib" "$gcc_crt_dir"
          "$PS3DEV/ppu/bin/powerpc64-ps3-elf-gcc" \
            -c -mcpu=cell -mregnames -D__ASSEMBLY__ -Wa,-mcell \
            Crash-Bash-Enhanced/ps3/compat/lv2-crtn.S \
            -o "$crtn_object"
          cp "$crtn_object" "$gcc_crt_dir/lv2-crtn.o"
          test -s "$crtn_object"
          ln -sf liblv2_stub.a "$PS3DK/ppu/lib/liblv2.a"
          # This installer links only the staged runtime and import stubs above;
          # the full PS3DK SDK manifest is verified by the SDK's own release CI.
          # Skip that unrelated full-tree probe for this intentionally minimal build.
          CB_PKGFILES="$pkg_files" cmake -S Crash-Bash-Enhanced/ps3/installer -B Crash-Bash-Enhanced/ps3/build/pkg-installer -D_PS3_SELF_SDK_INSTALL_PROBED=TRUE -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/crashbash-PS3DK-src/cmake/ps3-ppu-toolchain.cmake" -DCMAKE_BUILD_TYPE=Release
          cmake --build Crash-Bash-Enhanced/ps3/build/pkg-installer --target crash_bash_online_installer_pkg
          test -s Crash-Bash-Enhanced/ps3/build/pkg-installer/crash_bash_online_installer.pkg
          test -s Crash-Bash-Enhanced/ps3/build/pkg-installer/crash_bash_online_installer.gnpdrm.pkg
          python3 Crash-Bash-Enhanced/ps3/installer/verify_pkg.py \
            Crash-Bash-Enhanced/ps3/build/pkg-installer/crash_bash_online_installer.pkg \
            Crash-Bash-Enhanced/ps3/build/pkg-installer/crash_bash_online_installer.gnpdrm.pkg
      - uses: actions/upload-artifact@v6
        with:
          name: crash-bash-ps3-pkg
          path: |
            Crash-Bash-Enhanced/ps3/build/crash_bash_input.prx
            Crash-Bash-Enhanced/ps3/build/crash_bash_input.fake.sprx
            Crash-Bash-Enhanced/ps3/build/crash_bash_input.elf
            Crash-Bash-Enhanced/ps3/build/loader/crash_bash_loader.prx
            Crash-Bash-Enhanced/ps3/build/loader/crash_bash_loader.fake.sprx
            Crash-Bash-Enhanced/ps3/build/loader/crash_bash_loader.elf
            Crash-Bash-Enhanced/ps3/build/pkg-installer/crash_bash_online_installer.pkg
            Crash-Bash-Enhanced/ps3/build/pkg-installer/crash_bash_online_installer.gnpdrm.pkg
            Crash-Bash-Enhanced/ps3/build/pkg-installer/crash_bash_online_installer.self
            Crash-Bash-Enhanced/ps3/build/pkg-installer/crash_bash_online_installer.fake.self
