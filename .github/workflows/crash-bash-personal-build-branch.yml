name: Crash Bash Personal Game-Inclusive Build (Branch Trigger)

on:
  push:
    branches: [crash-bash-enhanced]
    paths:
      - "Crash-Bash-Enhanced/PRIVATE_BUILD_TRIGGER.txt"

permissions:
  contents: read

concurrency:
  group: crash-bash-personal-game-inclusive
  cancel-in-progress: false

jobs:
  preflight:
    name: Check private source and recipient certificate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify private HTTPS source secret without exposing it
        shell: bash
        env:
          DISC_ARCHIVE_URL: ${{ secrets.CRASH_BASH_DISC_ARCHIVE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$DISC_ARCHIVE_URL" ]]; then
            echo "PRIVATE_SOURCE_SECRET=missing"
            exit 2
          fi
          echo "::add-mask::$DISC_ARCHIVE_URL"
          case "$DISC_ARCHIVE_URL" in
            https://*) echo "PRIVATE_SOURCE_SECRET=present_https" ;;
            *) echo "PRIVATE_SOURCE_SECRET=present_but_not_https"; exit 2 ;;
          esac
      - name: Validate recipient certificate and CMS encryption
        run: |
          set -euo pipefail
          CERT="Crash-Bash-Enhanced/keys/personal-build-public.pem"
          test -s "$CERT"
          openssl x509 -in "$CERT" -noout -subject -fingerprint -sha256 -dates
          printf 'Crash Bash private-build certificate preflight\n' > /tmp/cb-preflight.txt
          openssl cms -encrypt -binary -stream -aes-256-cbc \
            -in /tmp/cb-preflight.txt -out /tmp/cb-preflight.cms \
            -outform DER "$CERT"
          openssl cms -cmsout -print -inform DER -in /tmp/cb-preflight.cms >/dev/null
          sha256sum /tmp/cb-preflight.cms

  personal-pkg:
    name: Build and encrypt the unified game-inclusive PKG
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/02900/ps3-toolchain-tiny3d:latest
    steps:
      - name: Checkout enhanced project source
        uses: actions/checkout@v4
        with:
          ref: crash-bash-enhanced

      - name: Download the private BIN/CUE archive
        shell: bash
        env:
          DISC_ARCHIVE_URL: ${{ secrets.CRASH_BASH_DISC_ARCHIVE_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::$DISC_ARCHIVE_URL"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 30 --max-time 900 --max-filesize 536870912 \
            "$DISC_ARCHIVE_URL" --output /tmp/crash-bash-disc.zip
          test -s /tmp/crash-bash-disc.zip
          python3 - <<'PY'
          import zipfile
          path = "/tmp/crash-bash-disc.zip"
          with zipfile.ZipFile(path) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP member: {bad}")
              files = [item.filename for item in archive.infolist() if not item.is_dir()]
              if not files:
                  raise SystemExit("The disc ZIP is empty.")
              print(f"Validated ZIP container with {len(files)} file entries.")
          PY

      - name: Build pinned RetroArch and PCSX-ReARMed runtime
        shell: bash
        run: bash Crash-Bash-Enhanced/scripts/build_online_pkg_clean.sh

      - name: Stage runtime inside the unified application
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME="Crash-Bash-Enhanced/build-artifacts/retroarch-stage/USRDIR/retroarch"
          DEST="Crash-Bash-Enhanced/pkgfiles/USRDIR/retroarch"
          test -s "$RUNTIME/EBOOT.BIN"
          test -s "$RUNTIME/cores/pcsx_rearmed_libretro_psl1ght.SELF"
          mkdir -p "$DEST"
          cp -a "$RUNTIME/." "$DEST/"

      - name: Build and verify personal game-inclusive PKG
        shell: bash
        env:
          CRASH_BASH_DISC_ARCHIVE: /tmp/crash-bash-disc.zip
        run: |
          set -euo pipefail
          bash Crash-Bash-Enhanced/scripts/build_personal_pkg.sh
          cd Crash-Bash-Enhanced/build-artifacts
          sha256sum -c Crash-Bash-Online-Personal-PS3.pkg.sha256
          test -s Crash-Bash-Online-Personal-PS3.pkg
          test -s PERSONAL-BUILD-MANIFEST.txt

      - name: Encrypt personal PKG and remove plaintext payload
        shell: bash
        run: |
          set -euo pipefail
          PKG="Crash-Bash-Enhanced/build-artifacts/Crash-Bash-Online-Personal-PS3.pkg"
          CERT="Crash-Bash-Enhanced/keys/personal-build-public.pem"
          ENCRYPTED="/tmp/Crash-Bash-Online-Personal-PS3.pkg.cms"
          test -s "$PKG"
          openssl cms -encrypt -binary -stream -aes-256-cbc \
            -in "$PKG" -out "$ENCRYPTED" -outform DER "$CERT"
          openssl cms -cmsout -print -inform DER -in "$ENCRYPTED" >/dev/null
          sha256sum "$ENCRYPTED" > "$ENCRYPTED.sha256"
          cp "Crash-Bash-Enhanced/build-artifacts/PERSONAL-BUILD-MANIFEST.txt" \
            /tmp/PERSONAL-BUILD-MANIFEST.txt
          rm -f "$PKG" "$PKG.sha256" /tmp/crash-bash-disc.zip Crash-Bash-Enhanced/crashbash.pkg
          rm -rf Crash-Bash-Enhanced/pkgfiles/USRDIR/PSXISO \
            Crash-Bash-Enhanced/build/pkg Crash-Bash-Enhanced/game

      - name: Upload encrypted package only
        uses: actions/upload-artifact@v4
        with:
          name: Crash-Bash-Online-Personal-PS3-Encrypted
          path: |
            /tmp/Crash-Bash-Online-Personal-PS3.pkg.cms
            /tmp/Crash-Bash-Online-Personal-PS3.pkg.cms.sha256
            /tmp/PERSONAL-BUILD-MANIFEST.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
