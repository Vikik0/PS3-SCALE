name: Ghosts Co-op prototype tests

on:
  push:
    branches:
      - feature/ghosts-campaign-coop-prototype-0.2
    paths:
      - "experiments/ghosts-campaign-coop/**"
      - ".github/workflows/ghosts-coop-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run compatibility registry tests
        working-directory: experiments/ghosts-campaign-coop
        run: python -m unittest discover -s tests -v
