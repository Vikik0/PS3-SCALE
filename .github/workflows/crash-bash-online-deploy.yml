name: Crash Bash lobby deployment

on:
  push:
    branches:
      - feature/crash-bash-online-enhanced-0.1
    paths:
      - "Crash-Bash-Enhanced/worker/**"
      - ".github/workflows/crash-bash-online-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare credentials
        id: credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions secrets to deploy."
          fi
      - uses: actions/checkout@v4
        if: steps.credentials.outputs.configured == 'true'
      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.configured == 'true'
        with:
          node-version: "22"
      - name: Install Worker dependencies
        if: steps.credentials.outputs.configured == 'true'
        working-directory: Crash-Bash-Enhanced/worker
        run: npm install --no-audit --no-fund
      - name: Deploy matchmaking Worker
        if: steps.credentials.outputs.configured == 'true'
        working-directory: Crash-Bash-Enhanced/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Confirm deployment is waiting for account credentials
        if: steps.credentials.outputs.configured != 'true'
        run: echo "Source and CI are ready; public Worker deployment is waiting for Cloudflare account credentials."
