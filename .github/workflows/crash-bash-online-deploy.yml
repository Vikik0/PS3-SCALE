name: Crash Bash lobby deployment

on:
  push:
    branches:
      - feature/crash-bash-online-enhanced-0.1
    paths:
      - "Crash-Bash-Enhanced/worker/**"
      - "Crash-Bash-Enhanced/web/**"
      - ".github/workflows/crash-bash-online-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare credentials
        id: credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions secrets to deploy."
          fi
      - uses: actions/checkout@v4
        if: steps.credentials.outputs.configured == 'true'
      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.configured == 'true'
        with:
          node-version: "22"
      - name: Install web dependencies
        if: steps.credentials.outputs.configured == 'true'
        working-directory: Crash-Bash-Enhanced/web
        run: npm install --no-audit --no-fund
      - name: Build the static lobby
        if: steps.credentials.outputs.configured == 'true'
        working-directory: Crash-Bash-Enhanced/web
        run: npm run build
      - name: Install Worker dependencies
        if: steps.credentials.outputs.configured == 'true'
        working-directory: Crash-Bash-Enhanced/worker
        run: npm install --no-audit --no-fund
      - name: Deploy Worker and static lobby
        if: steps.credentials.outputs.configured == 'true'
        id: deploy
        working-directory: Crash-Bash-Enhanced/worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/crash-bash-wrangler-deploy.log"
          npx wrangler deploy 2>&1 | tee "$log"
          worker_url="$(grep -Eo 'https://[[:alnum:].-]+\.workers\.dev' "$log" | tail -n 1 || true)"
          if [[ -z "$worker_url" ]]; then
            echo "Could not determine the deployed workers.dev URL from Wrangler output." >&2
            exit 1
          fi
          echo "url=$worker_url" >> "$GITHUB_OUTPUT"
          health="$(curl --fail --silent --show-error --retry 10 --retry-delay 3 "$worker_url/health")"
          printf '%s' "$health" | grep -q '"ok":true'
          echo "Health check passed: $worker_url/health"
          echo "Lobby URL: $worker_url"
      - name: Confirm deployment is waiting for account credentials
        if: steps.credentials.outputs.configured != 'true'
        run: echo "Source and CI are ready; public Worker and lobby deployment are waiting for Cloudflare account credentials."
