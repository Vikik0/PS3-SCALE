name: Crash Bash Personal Game-Inclusive PS3 Build

run-name: Personal game-inclusive Crash Bash PKG

on:
  workflow_dispatch:
    inputs:
      runtime_run_id:
        description: "Optional successful PS3 runtime build ID; leave blank to select the latest verified build automatically"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: crash-bash-personal-pkg
  cancel-in-progress: false

jobs:
  personal-pkg:
    name: Build and encrypt one game-inclusive PS3 PKG
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/02900/ps3-toolchain-tiny3d:latest
    steps:
      - name: Checkout the enhanced project source
        uses: actions/checkout@v4
        with:
          ref: crash-bash-enhanced

      - name: Validate and mask the private download URL
        shell: bash
        env:
          DISC_ARCHIVE_URL: ${{ secrets.CRASH_BASH_DISC_ARCHIVE_URL }}
        run: |
          set -euo pipefail
          test -n "$DISC_ARCHIVE_URL"
          case "$DISC_ARCHIVE_URL" in
            https://*) ;;
            *) echo "A private HTTPS download URL is required." >&2; exit 1 ;;
          esac
          echo "::add-mask::$DISC_ARCHIVE_URL"

      - name: Verify PS3 build tools and recipient certificate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PSL1GHT"
          test -n "$PS3DEV"
          for tool in ppu-gcc ppu-g++ make_self_npdrm pkg package_finalize sfo curl openssl sha256sum; do
            command -v "$tool"
          done
          test -s "$PS3DEV/bin/sfo.xml"
          CERT="Crash-Bash-Enhanced/keys/personal-build-public.pem"
          test -s "$CERT"
          openssl x509 -in "$CERT" -noout -checkend 0
          ACTUAL_CERT_SHA256="$(openssl x509 -in "$CERT" -noout -fingerprint -sha256 | sed 's/.*=//; s/://g' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT_SHA256="d31cc3af70d4a049ba395f9bcd6dce6cd7f6a0e1120e13a7b5fc905168ae14f0"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          printf 'Crash Bash personal package preflight\n' > /tmp/cb-preflight.txt
          openssl cms -encrypt -binary -stream -aes-256-cbc \
            -in /tmp/cb-preflight.txt -out /tmp/cb-preflight.cms \
            -outform DER "$CERT"
          openssl cms -cmsout -print -inform DER -in /tmp/cb-preflight.cms >/dev/null

      - name: Validate and select a successful RetroArch runtime artifact
        id: runtime
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          requested = os.environ.get("REQUESTED_RUNTIME_RUN_ID", "").strip()
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def github_get(path):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}{path}",
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          if requested:
              if not requested.isdigit():
                  raise SystemExit("runtime_run_id must contain digits only.")
              candidates = [int(requested)]
          else:
              history = github_get(
                  "/actions/runs?branch=crash-bash-enhanced&status=completed&per_page=100"
              )
              candidates = [
                  item["id"] for item in history.get("workflow_runs", [])
                  if item.get("path") == ".github/workflows/crash-bash-build.yml"
                  and item.get("conclusion") == "success"
                  and item.get("event") in ("push", "workflow_dispatch")
                  and item.get("head_repository", {}).get("full_name") == repository
              ]

          selected = None
          for run_id in candidates:
              run = github_get(f"/actions/runs/{run_id}")
              if (
                  run.get("head_branch") != "crash-bash-enhanced"
                  or run.get("path") != ".github/workflows/crash-bash-build.yml"
                  or run.get("status") != "completed"
                  or run.get("conclusion") != "success"
                  or run.get("event") not in ("push", "workflow_dispatch")
                  or run.get("head_repository", {}).get("full_name") != repository
              ):
                  if requested:
                      raise SystemExit("Selected run is not a successful Crash Bash PS3 runtime build.")
                  continue

              artifacts = github_get(f"/actions/runs/{run_id}/artifacts")
              valid = [
                  item for item in artifacts.get("artifacts", [])
                  if item.get("name") == "Crash-Bash-RetroArch-Stage"
                  and not item.get("expired")
                  and 0 < item.get("size_in_bytes", 0) <= 64 * 1024 * 1024
              ]
              if valid:
                  selected = run_id
                  break
              if requested:
                  raise SystemExit("Selected run has no valid, unexpired RetroArch runtime artifact.")

          if selected is None:
              raise SystemExit(
                  "No successful Crash-Bash-RetroArch-Stage artifact is available. "
                  "Run the Crash Bash Enhanced PS3 Build workflow first."
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("run_id=%s" % selected + chr(10))
          print(f"Verified successful PS3 runtime build and selected artifact from run {selected}.")
          PY

      - name: Download and validate the private BIN/CUE archive
        shell: bash
        env:
          DISC_ARCHIVE_URL: ${{ secrets.CRASH_BASH_DISC_ARCHIVE_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::$DISC_ARCHIVE_URL"
          python3 - "$DISC_ARCHIVE_URL" <<'PY'
          import sys
          from urllib.parse import urlparse
          parsed = urlparse(sys.argv[1])
          host = (parsed.hostname or "").lower()
          if parsed.scheme != "https" or not (
              host == "dropbox.com" or host.endswith(".dropbox.com") or
              host.endswith(".dropboxusercontent.com")
          ):
              raise SystemExit("Use an HTTPS Dropbox temporary download URL for the private disc archive.")
          PY
          curl --fail --silent --show-error --location --max-redirs 3 \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 30 --max-time 900 --max-filesize 536870912 \
            "$DISC_ARCHIVE_URL" --output /tmp/crash-bash-disc.zip
          test -s /tmp/crash-bash-disc.zip
          python3 - <<'PY'
          import zipfile
          path = "/tmp/crash-bash-disc.zip"
          with zipfile.ZipFile(path) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP member: {bad}")
              files = [item for item in archive.infolist() if not item.is_dir()]
              names = {item.filename for item in files}
              expected = {"Crash Bash (USA).bin", "Crash Bash (USA).cue"}
              if names != expected:
                  raise SystemExit(f"Expected exactly {sorted(expected)}, received {sorted(names)}")
              sizes = {item.filename: item.file_size for item in files}
              if sizes["Crash Bash (USA).bin"] != 178220448:
                  raise SystemExit("The Crash Bash BIN size does not match the verified original dump.")
              if sizes["Crash Bash (USA).bin"] % 2352:
                  raise SystemExit("The BIN is not aligned to 2352-byte sectors.")
              import hashlib
              expected_hashes = {
                  "Crash Bash (USA).bin": "a1d6b967a2311f1444482f4af91dff2d75e083ed538419f25d57d77dd5a4d7fd",
                  "Crash Bash (USA).cue": "de7f3b62c2703f3a1ee76a5d10e5fb27cc386dea26b196807e5eec5e04a8fce9",
              }
              for name, expected_hash in expected_hashes.items():
                  actual_hash = hashlib.sha256(archive.read(name)).hexdigest()
                  if actual_hash != expected_hash:
                      raise SystemExit(f"{name} SHA-256 does not match the verified original disc dump.")
              cue = archive.read("Crash Bash (USA).cue").decode("utf-8-sig")
              if 'FILE "Crash Bash (USA).bin" BINARY' not in cue or "TRACK 01 MODE2/2352" not in cue:
                  raise SystemExit("The CUE does not describe the expected Crash Bash BIN track.")
              print(f"Validated exact original BIN/CUE dump: {sizes['Crash Bash (USA).bin']:,} BIN bytes; both SHA-256 hashes match.")
          PY

      - name: Audit the original Crash Bash PS1 filesystem and DAT index
        shell: bash
        run: |
          set -euo pipefail
          INPUT_DIR="/tmp/cb-original-disc-input"
          AUDIT_DIR="/tmp/cb-original-disc-audit"
          rm -rf "$INPUT_DIR" "$AUDIT_DIR"
          mkdir -p "$INPUT_DIR" "$AUDIT_DIR"
          python3 - <<'PY'
          import shutil
          import zipfile
          archive_path = "/tmp/crash-bash-disc.zip"
          destination = "/tmp/cb-original-disc-input"
          with zipfile.ZipFile(archive_path) as archive:
              for name in ("Crash Bash (USA).bin", "Crash Bash (USA).cue"):
                  with archive.open(name) as source, open(f"{destination}/{name}", "wb") as output:
                      shutil.copyfileobj(source, output, length=1024 * 1024)
          PY
          python3 Crash-Bash-Enhanced/tools/extract_disc.py \
            --bin "$INPUT_DIR/Crash Bash (USA).bin" \
            --cue "$INPUT_DIR/Crash Bash (USA).cue" \
            --out "$AUDIT_DIR"
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("/tmp/cb-original-disc-audit/disc_manifest.json").read_text(encoding="utf-8"))
          expected = {
              "dat_entry_count": 992,
              "size": 73220096,
              "sha256": "3a02b477ab48ae99010e1a9db3b0d591c79e800b43d10779945ca18ab788acb7",
              "executable_sha256": "fd5727a18feb2a2d5a6359a55966f0266284d1e50f64ee9b8a127a97091bd516",
              "disc_bin_size": 178220448,
          }
          for field, value in expected.items():
              if manifest.get(field) != value:
                  raise SystemExit(f"Original Crash Bash disc audit mismatch for {field}: {manifest.get(field)!r}")
          print("Verified original Crash Bash boot executable and all 992 CRASHBSH.DAT index entries.")
          print("DAT split/reconstruction is byte-identical; temporary extracted game assets remain outside the package.")
          PY
          rm -rf "$INPUT_DIR" "$AUDIT_DIR"

      - name: Download the verified RetroArch + PCSX-ReARMed runtime
        uses: actions/download-artifact@v4
        with:
          name: Crash-Bash-RetroArch-Stage
          path: Crash-Bash-Enhanced/pkgfiles/USRDIR/retroarch
          run-id: ${{ steps.runtime.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the downloaded embedded runtime
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME="Crash-Bash-Enhanced/pkgfiles/USRDIR/retroarch"
          test -s "$RUNTIME/EBOOT.BIN"
          test -s "$RUNTIME/cores/pcsx_rearmed_libretro_psl1ght.SELF"
          test -s "$RUNTIME/system/README-BIOS.txt"

      - name: Build and verify the personal game-inclusive PKG
        shell: bash
        env:
          CRASH_BASH_DISC_ARCHIVE: /tmp/crash-bash-disc.zip
        run: |
          set -euo pipefail
          bash Crash-Bash-Enhanced/scripts/build_personal_pkg.sh
          PKG="$GITHUB_WORKSPACE/Crash-Bash-Enhanced/build-artifacts/Crash-Bash-Online-Personal-PS3.pkg"
          test -s "$PKG"
          cd Crash-Bash-Enhanced/build-artifacts
          sha256sum -c Crash-Bash-Online-Personal-PS3.pkg.sha256
          test -s PERSONAL-BUILD-MANIFEST.txt
          test -s PERSONAL-PKG-CONTENTS.txt
          grep -q "PKG item count:" PERSONAL-BUILD-MANIFEST.txt
          grep -q "Installable packages: one PKG only" PERSONAL-BUILD-MANIFEST.txt
          grep -q "CUE: Crash Bash (USA).cue" PERSONAL-BUILD-MANIFEST.txt
          grep -q "TRACK: Crash Bash (USA).bin" PERSONAL-BUILD-MANIFEST.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          pkg = Path("Crash-Bash-Online-Personal-PS3.pkg")
          manifest = Path("PERSONAL-BUILD-MANIFEST.txt").read_text(encoding="utf-8")
          inventory = Path("PERSONAL-PKG-CONTENTS.txt").read_text(encoding="utf-8")
          size = pkg.stat().st_size
          digest = hashlib.sha256(pkg.read_bytes()).hexdigest()
          if f"PKG size: {size} bytes" not in manifest:
              raise SystemExit("Personal manifest PKG size does not match the output file.")
          if f"PKG SHA-256: {digest}" not in manifest:
              raise SystemExit("Personal manifest PKG SHA-256 does not match the output file.")
          counts = re.findall(r"^PKG item count: (\d+) / 1024$", manifest + "\n" + inventory, re.M)
          if len(counts) != 2 or counts[0] != counts[1]:
              raise SystemExit("Personal manifest and package inventory item counts do not match.")
          required = (
              "USRDIR/EBOOT.BIN",
              "USRDIR/retroarch/EBOOT.BIN",
              "USRDIR/retroarch/cores/pcsx_rearmed_libretro_psl1ght.SELF",
              "USRDIR/PSXISO/Crash Bash (USA).cue",
              "USRDIR/PSXISO/Crash Bash (USA).bin",
          )
          missing = [path for path in required if path not in inventory.splitlines()]
          if missing:
              raise SystemExit("Game-inclusive PKG inventory is missing: " + ", ".join(missing))
          print(f"Verified personal PKG manifest, SHA-256, {counts[0]} entries and game/lobby/runtime payload.")
          PY
          grep -q "SHA256: a1d6b967a2311f1444482f4af91dff2d75e083ed538419f25d57d77dd5a4d7fd" PERSONAL-BUILD-MANIFEST.txt
          grep -q "CUE SHA256: de7f3b62c2703f3a1ee76a5d10e5fb27cc386dea26b196807e5eec5e04a8fce9" PERSONAL-BUILD-MANIFEST.txt

      - name: Encrypt the personal PKG for private transfer
        shell: bash
        run: |
          set -euo pipefail
          PKG="Crash-Bash-Enhanced/build-artifacts/Crash-Bash-Online-Personal-PS3.pkg"
          CERT="Crash-Bash-Enhanced/keys/personal-build-public.pem"
          ENCRYPTED="/tmp/Crash-Bash-Online-Personal-PS3.pkg.cms"
          test -s "$PKG"
          test -s "$CERT"
          openssl cms -encrypt -binary -stream -aes-256-cbc \
            -in "$PKG" -out "$ENCRYPTED" -outform DER "$CERT"
          test -s "$ENCRYPTED"
          openssl cms -cmsout -print -inform DER -in "$ENCRYPTED" >/dev/null
          sha256sum "$ENCRYPTED" > "$ENCRYPTED.sha256"
          cp "Crash-Bash-Enhanced/build-artifacts/PERSONAL-BUILD-MANIFEST.txt" /tmp/PERSONAL-BUILD-MANIFEST.txt
          cp "Crash-Bash-Enhanced/build-artifacts/PERSONAL-PKG-CONTENTS.txt" /tmp/PERSONAL-PKG-CONTENTS.txt
          rm -f "$PKG" "$PKG.sha256" /tmp/crash-bash-disc.zip Crash-Bash-Enhanced/crashbash.pkg
          rm -rf Crash-Bash-Enhanced/pkgfiles/USRDIR/PSXISO \
            Crash-Bash-Enhanced/build/pkg Crash-Bash-Enhanced/game

      - name: Upload encrypted package only
        uses: actions/upload-artifact@v4
        with:
          name: Crash-Bash-Online-Personal-PS3-Encrypted
          path: |
            /tmp/Crash-Bash-Online-Personal-PS3.pkg.cms
            /tmp/Crash-Bash-Online-Personal-PS3.pkg.cms.sha256
            /tmp/PERSONAL-BUILD-MANIFEST.txt
            /tmp/PERSONAL-PKG-CONTENTS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
