name: PS3 SCALE build

on:
  push:
    branches: [main, master]
    paths:
      - "PS3-SCALE-Alpha-0.2/**"
      - ".github/workflows/build-ps3.yml"
  pull_request:
    paths:
      - "PS3-SCALE-Alpha-0.2/**"
      - ".github/workflows/build-ps3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host-side tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install host compiler and preview dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          python3 -m pip install --user pillow

      - name: Fetch pinned Noto Sans Arabic UI font
        working-directory: PS3-SCALE-Alpha-0.2
        run: |
          chmod +x scripts/fetch_assets.sh
          ./scripts/fetch_assets.sh

      - name: Run SFO, scanner, ISO, and PS2 CONFIG tests
        working-directory: PS3-SCALE-Alpha-0.2
        run: |
          chmod +x scripts/test_host.sh
          ./scripts/test_host.sh

      - name: Render embedded Arabic bitmap preview
        working-directory: PS3-SCALE-Alpha-0.2
        run: python3 tests/render_font_preview.py

      - name: Upload Arabic bitmap preview
        uses: actions/upload-artifact@v4
        with:
          name: PS3-SCALE-Alpha-0.2-arabic-font-preview
          if-no-files-found: error
          path: PS3-SCALE-Alpha-0.2/build-host/arabic-font-preview.png

  ps3-build:
    name: Build PS3 ELF, SELF, and PKG
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/02900/ps3-toolchain-tiny3d:latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          echo "PS3DEV=$PS3DEV"
          echo "PSL1GHT=$PSL1GHT"
          command -v ppu-gcc
          command -v make
          command -v make_self
          command -v make_self_npdrm
          command -v package_finalize

      - name: Fetch pinned Noto Sans Arabic UI font
        working-directory: PS3-SCALE-Alpha-0.2
        run: |
          chmod +x scripts/fetch_assets.sh
          ./scripts/fetch_assets.sh

      - name: Build LGPL MP3 decoder
        run: |
          set -eu
          git clone https://github.com/wargio/ps3soundlib.git /tmp/ps3soundlib
          git -C /tmp/ps3soundlib checkout 262ea20d4e4e3fb5d0aca8a60d09d631c0e17fb8
          make -C /tmp/ps3soundlib/libs/libmpg123 install
          test -s "$PORTLIBS/lib/libmpg123.a"
          test -s "$PORTLIBS/include/soundlib/mpg123.h"

      - name: Check bundled theme asset
        run: |
          if [ -s "PS3-SCALE-Alpha-0.2/pkgfiles/USRDIR/theme.mp3" ]; then
            echo "Bundled theme MP3 found; it will be copied into the installed USRDIR."
          else
            echo "::warning::theme.mp3 is not present in pkgfiles/USRDIR; the package will use the existing USB/HDD fallback."
          fi

      - name: Build and validate PS3 packages
        working-directory: PS3-SCALE-Alpha-0.2
        run: |
          set -eu
          make clean
          make pkg
          test -s ps3scale.elf
          test -s ps3scale.self
          test -s ps3scale.pkg
          test -s ps3scale.gnpdrm.pkg

          PKG_MAGIC="$(od -An -tx1 -N4 ps3scale.gnpdrm.pkg | tr -d ' \n')"
          PKG_REVISION="$(od -An -tx1 -j4 -N2 ps3scale.gnpdrm.pkg | tr -d ' \n')"
          test "$PKG_MAGIC" = "7f504b47"
          test "$PKG_REVISION" = "8000"

          echo "Build outputs:"
          ls -lah ps3scale.elf ps3scale.self ps3scale.pkg ps3scale.gnpdrm.pkg
          echo "SHA-256:"
          sha256sum ps3scale.elf ps3scale.self ps3scale.pkg ps3scale.gnpdrm.pkg

      - name: Upload PS3 build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PS3-SCALE-Alpha-0.2-build
          if-no-files-found: error
          path: |
            PS3-SCALE-Alpha-0.2/ps3scale.elf
            PS3-SCALE-Alpha-0.2/ps3scale.self
            PS3-SCALE-Alpha-0.2/ps3scale.pkg
            PS3-SCALE-Alpha-0.2/ps3scale.gnpdrm.pkg
