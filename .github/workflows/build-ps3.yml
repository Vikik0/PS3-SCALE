name: PS3 SCALE build

on:
  push:
    branches: [main, master]
    paths:
      - "PS3-SCALE-Alpha-0.2/**"
      - ".github/workflows/build-ps3.yml"
  pull_request:
    paths:
      - "PS3-SCALE-Alpha-0.2/**"
      - ".github/workflows/build-ps3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host-side tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install host compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Run SFO, scanner, and ISO tests
        working-directory: PS3-SCALE-Alpha-0.2
        run: |
          chmod +x scripts/test_host.sh
          ./scripts/test_host.sh

  ps3-build:
    name: Build PS3 ELF, SELF, and PKG
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/02900/ps3-toolchain-tiny3d:latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          echo "PS3DEV=$PS3DEV"
          echo "PSL1GHT=$PSL1GHT"
          command -v ppu-gcc
          command -v make
          command -v make_self
          command -v make_self_npdrm
          command -v package_finalize

      - name: Build and validate PS3 packages
        working-directory: PS3-SCALE-Alpha-0.2
        run: |
          set -eu
          make clean
          make pkg
          test -s ps3scale.elf
          test -s ps3scale.self
          test -s ps3scale.pkg
          test -s ps3scale.gnpdrm.pkg

          PKG_MAGIC="$(od -An -tx1 -N4 ps3scale.gnpdrm.pkg | tr -d ' \n')"
          PKG_REVISION="$(od -An -tx1 -j4 -N2 ps3scale.gnpdrm.pkg | tr -d ' \n')"
          test "$PKG_MAGIC" = "7f504b47"
          test "$PKG_REVISION" = "8000"

          echo "Build outputs:"
          ls -lah ps3scale.elf ps3scale.self ps3scale.pkg ps3scale.gnpdrm.pkg
          echo "SHA-256:"
          sha256sum ps3scale.elf ps3scale.self ps3scale.pkg ps3scale.gnpdrm.pkg

      - name: Upload PS3 build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PS3-SCALE-Alpha-0.2-build
          if-no-files-found: error
          path: |
            PS3-SCALE-Alpha-0.2/ps3scale.elf
            PS3-SCALE-Alpha-0.2/ps3scale.self
            PS3-SCALE-Alpha-0.2/ps3scale.pkg
            PS3-SCALE-Alpha-0.2/ps3scale.gnpdrm.pkg
