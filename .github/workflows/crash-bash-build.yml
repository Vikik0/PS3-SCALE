name: Crash Bash Enhanced PS3 Build

on:
  push:
    branches: [crash-bash-enhanced]
    paths:
      - "Crash-Bash-Enhanced/Makefile"
      - "Crash-Bash-Enhanced/source/**"
      - "Crash-Bash-Enhanced/include/**"
      - "Crash-Bash-Enhanced/tests/**"
      - "Crash-Bash-Enhanced/scripts/**"
      - "Crash-Bash-Enhanced/pkgfiles/**"
      - "Crash-Bash-Enhanced/sfo.xml"
      - "Crash-Bash-Enhanced/sfo-native.xml"
      - ".github/workflows/crash-bash-build.yml"
  pull_request:
    branches: [crash-bash-enhanced]
    paths:
      - "Crash-Bash-Enhanced/Makefile"
      - "Crash-Bash-Enhanced/source/**"
      - "Crash-Bash-Enhanced/include/**"
      - "Crash-Bash-Enhanced/tests/**"
      - "Crash-Bash-Enhanced/scripts/**"
      - "Crash-Bash-Enhanced/pkgfiles/**"
      - "Crash-Bash-Enhanced/sfo.xml"
      - ".github/workflows/crash-bash-build.yml"
  workflow_dispatch:

permissions:
  contents: read

# Avoid spending runner time building obsolete commits of this branch.
concurrency:
  group: crash-bash-enhanced-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host protocol and build-script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PS3 package build script syntax
        run: bash -n Crash-Bash-Enhanced/scripts/build_online_pkg_clean.sh
      - name: Validate PS3 package metadata
        run: python3 Crash-Bash-Enhanced/scripts/test_package_metadata.py
      - name: Run protocol tests
        run: sh Crash-Bash-Enhanced/scripts/test_host.sh

  native-lobby-build:
    name: Build native Tiny3D lobby companion PKG
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/02900/ps3-toolchain-tiny3d:latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PS3 toolchain
        run: |
          set -eu
          test -n "$PSL1GHT"
          test -n "$PS3DEV"
          command -v ppu-gcc
          command -v ppu-g++
          command -v make_self_npdrm
          command -v pkg
          command -v package_finalize
          command -v sfo
          command -v wget
          test -s "$PS3DEV/bin/sfo.xml"
      - name: Build the native Tiny3D lobby app
        run: |
          set -eu
          make -C Crash-Bash-Enhanced clean
          make -C Crash-Bash-Enhanced pkg
          test -s Crash-Bash-Enhanced/crashbash.pkg
      - name: Verify and checksum native lobby PKG
        run: |
          set -eu
          PKG="Crash-Bash-Enhanced/crashbash.pkg"
          MAGIC="$(od -An -tx1 -N4 "$PKG" | tr -d ' \\n')"
          REVISION="$(od -An -tx1 -j4 -N2 "$PKG" | tr -d ' \\n')"
          test "$MAGIC" = "7f504b47"
          test "$REVISION" = "8000"
          mkdir -p Crash-Bash-Enhanced/build-artifacts
          cp "$PKG" Crash-Bash-Enhanced/build-artifacts/Crash-Bash-Enhanced-Native-Lobby-PS3.pkg
          cd Crash-Bash-Enhanced/build-artifacts
          sha256sum Crash-Bash-Enhanced-Native-Lobby-PS3.pkg > Crash-Bash-Enhanced-Native-Lobby-PS3.pkg.sha256
          sha256sum -c Crash-Bash-Enhanced-Native-Lobby-PS3.pkg.sha256
      - name: Upload native lobby PKG
        uses: actions/upload-artifact@v4
        with:
          name: Crash-Bash-Enhanced-Native-Lobby-PS3-PKG
          if-no-files-found: error
          compression-level: 0
          path: |
            Crash-Bash-Enhanced/build-artifacts/Crash-Bash-Enhanced-Native-Lobby-PS3.pkg
            Crash-Bash-Enhanced/build-artifacts/Crash-Bash-Enhanced-Native-Lobby-PS3.pkg.sha256

  online-package-build:
    name: Build Crash Bash Online PS3 package (RetroArch Netplay + PCSX-ReARMed)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/02900/ps3-toolchain-tiny3d:latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PS3 toolchain
        run: |
          set -eu
          test -n "$PSL1GHT"
          test -n "$PS3DEV"
          command -v ppu-gcc
          command -v ppu-g++
          command -v spu-gcc
          command -v make_self
          command -v make_self_npdrm
          command -v ppu-nm || command -v nm
          command -v pkg
          command -v package_finalize
          command -v sfo
          command -v git
          command -v wget
          command -v patch
          test -s "$PS3DEV/bin/sfo.xml"
          test -s "$PS3DEV/portlibs/ppu/lib/libz.a"
      - name: Build the online Crash Bash package
        run: bash Crash-Bash-Enhanced/scripts/build_online_pkg_clean.sh
      - name: Verify package checksum
        run: |
          cd Crash-Bash-Enhanced/build-artifacts
          sha256sum -c Crash-Bash-Online-PS3.pkg.sha256
          MAGIC="$(od -An -tx1 -N4 Crash-Bash-Online-PS3.pkg | tr -d ' \\n')"
          REVISION="$(od -An -tx1 -j4 -N2 Crash-Bash-Online-PS3.pkg | tr -d ' \\n')"
          test "$MAGIC" = "7f504b47"
          test "$REVISION" = "8000"
      - name: Upload installable PS3 package and build manifest
        uses: actions/upload-artifact@v4
        with:
          name: Crash-Bash-Online-PS3-PKG
          if-no-files-found: error
          compression-level: 0
          path: |
            Crash-Bash-Enhanced/build-artifacts/Crash-Bash-Online-PS3.pkg
            Crash-Bash-Enhanced/build-artifacts/Crash-Bash-Online-PS3.pkg.sha256
            Crash-Bash-Enhanced/build-artifacts/BUILD-MANIFEST.txt
