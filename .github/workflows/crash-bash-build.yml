name: Crash Bash Enhanced PS3 Build

on:
  push:
    branches: [crash-bash-enhanced]
    paths:
      - "Crash-Bash-Enhanced/**"
      - "api/**"
      - "tests/**"
      - "index.html"
      - "package.json"
      - "vercel.json"
      - ".github/workflows/crash-bash-build.yml"
  pull_request:
    branches: [crash-bash-enhanced]
    paths:
      - "Crash-Bash-Enhanced/**"
      - ".github/workflows/crash-bash-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host protocol and JSON tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run protocol tests
        run: sh Crash-Bash-Enhanced/scripts/test_host.sh

  web-tests:
    name: Web lobby security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        working-directory: .
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run web tests
        working-directory: .
        run: npm test

  online-package-build:
    name: Build Crash Bash Online PS3 package (RetroArch Netplay + PCSX-ReARMed)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/02900/ps3-toolchain-tiny3d:latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PS3 toolchain
        run: |
          set -eu
          test -n "$PSL1GHT"
          test -n "$PS3DEV"
          command -v ppu-gcc
          command -v ppu-g++
          command -v spu-gcc
          command -v make_self_npdrm
          command -v pkg
          command -v sfo
          command -v git
          command -v wget
          command -v patch
          test -s "$PS3DEV/portlibs/ppu/lib/libz.a"
      - name: Build the online Crash Bash package
        run: bash Crash-Bash-Enhanced/scripts/build_online_pkg.sh
      - name: Upload installable PS3 package
        uses: actions/upload-artifact@v4
        with:
          name: Crash-Bash-Online-PS3-PKG
          if-no-files-found: error
          path: Crash-Bash-Enhanced/build-artifacts/Crash-Bash-Online-PS3.pkg
