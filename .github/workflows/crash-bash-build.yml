name: Crash Bash Enhanced PS3 Build

on:
  push:
    branches: [crash-bash-enhanced]
    paths:
      - "Crash-Bash-Enhanced/Makefile"
      - "Crash-Bash-Enhanced/source/**"
      - "Crash-Bash-Enhanced/source/online.c"
      - "Crash-Bash-Enhanced/source/online_menu.c"
      - "Crash-Bash-Enhanced/include/**"
      - "Crash-Bash-Enhanced/include/online.h"
      - "Crash-Bash-Enhanced/tests/**"
      - "Crash-Bash-Enhanced/scripts/**"
      - "Crash-Bash-Enhanced/pkgfiles/**"
      - "Crash-Bash-Enhanced/sfo.xml"
      - "Crash-Bash-Enhanced/sfo-native.xml"
      - ".github/workflows/crash-bash-build.yml"
  pull_request:
    branches: [crash-bash-enhanced]
    paths:
      - "Crash-Bash-Enhanced/Makefile"
      - "Crash-Bash-Enhanced/source/**"
      - "Crash-Bash-Enhanced/source/online.c"
      - "Crash-Bash-Enhanced/source/online_menu.c"
      - "Crash-Bash-Enhanced/include/**"
      - "Crash-Bash-Enhanced/include/online.h"
      - "Crash-Bash-Enhanced/tests/**"
      - "Crash-Bash-Enhanced/scripts/**"
      - "Crash-Bash-Enhanced/pkgfiles/**"
      - "Crash-Bash-Enhanced/sfo.xml"
      - ".github/workflows/crash-bash-build.yml"
  workflow_dispatch:

permissions:
  contents: read

# Avoid spending runner time building obsolete commits of this branch.
concurrency:
  group: crash-bash-enhanced-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host protocol and build-script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PS3 package build script syntax
        run: |
          bash -n Crash-Bash-Enhanced/scripts/build_online_pkg_clean.sh
          bash -n Crash-Bash-Enhanced/scripts/build_personal_pkg.sh
          python3 -m py_compile Crash-Bash-Enhanced/scripts/stage_game_disc.py Crash-Bash-Enhanced/scripts/verify_pkg_contents.py
      - name: Validate PS3 package metadata
        run: python3 Crash-Bash-Enhanced/scripts/test_package_metadata.py
      - name: Run protocol tests
        run: sh Crash-Bash-Enhanced/scripts/test_host.sh

  native-lobby-build:
    name: Build unified Crash Bash Online PS3 PKG (Lobby + RetroArch)
    needs: online-package-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/02900/ps3-toolchain-tiny3d:latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PS3 toolchain
        run: |
          set -eu
          test -n "$PSL1GHT"
          test -n "$PS3DEV"
          command -v ppu-gcc
          command -v ppu-g++
          command -v make_self_npdrm
          command -v pkg
          command -v package_finalize
          command -v sfo
          command -v wget
          test -s "$PS3DEV/bin/sfo.xml"
      - name: Download embedded RetroArch runtime
        uses: actions/download-artifact@v4
        with:
          name: Crash-Bash-RetroArch-Stage
          path: Crash-Bash-Enhanced/pkgfiles/USRDIR/retroarch
      - name: Verify embedded RetroArch runtime
        run: |
          set -eu
          test -s Crash-Bash-Enhanced/pkgfiles/USRDIR/retroarch/EBOOT.BIN
          test -s Crash-Bash-Enhanced/pkgfiles/USRDIR/retroarch/cores/pcsx_rearmed_libretro_psl1ght.SELF
          test -s Crash-Bash-Enhanced/pkgfiles/USRDIR/retroarch/system/README-BIOS.txt
      - name: Build the unified native lobby + RetroArch app
        run: |
          set -eu
          make -C Crash-Bash-Enhanced clean
          make -C Crash-Bash-Enhanced pkg
          test -s Crash-Bash-Enhanced/crashbash.pkg
          test -s Crash-Bash-Enhanced/build/pkg/USRDIR/EBOOT.BIN
          SOURCE_RUNTIME="Crash-Bash-Enhanced/pkgfiles/USRDIR/retroarch"
          PACKAGED_RUNTIME="Crash-Bash-Enhanced/build/pkg/USRDIR/retroarch"
          test -s "$PACKAGED_RUNTIME/EBOOT.BIN"
          test -s "$PACKAGED_RUNTIME/cores/pcsx_rearmed_libretro_psl1ght.SELF"
          test -d "$PACKAGED_RUNTIME/assets/rgui"
          test -s "$PACKAGED_RUNTIME/assets/rgui/font/bitmap6x10_eng.bin"
          test -s "$PACKAGED_RUNTIME/assets/fonts/mplus-1p-regular.ttf"
          test -s "$PACKAGED_RUNTIME/assets/rgui/wallpaper/fractal_spiral.png"
          test -s "$PACKAGED_RUNTIME/info/pcsx_rearmed_libretro.info"
          test -s "$PACKAGED_RUNTIME/licenses/RetroArch-GPL-3.0.txt"
          SOURCE_FILES="$(find "$SOURCE_RUNTIME" -type f | wc -l)"
          PACKAGED_FILES="$(find "$PACKAGED_RUNTIME" -type f | wc -l)"
SOURCE_BYTES="$(find "$SOURCE_RUNTIME" -type f -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')"
PACKAGED_BYTES="$(find "$PACKAGED_RUNTIME" -type f -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')"
          test "$PACKAGED_FILES" = "$SOURCE_FILES"
          test "$PACKAGED_BYTES" = "$SOURCE_BYTES"
          test "$PACKAGED_FILES" -le 512
          test "$PACKAGED_BYTES" -le 33554432
          diff -qr "$SOURCE_RUNTIME" "$PACKAGED_RUNTIME"
          printf 'Embedded runtime verified: %s files, %s bytes\n' "$PACKAGED_FILES" "$PACKAGED_BYTES"
      - name: Verify and checksum native lobby PKG
        run: |
          set -eu
          PKG="Crash-Bash-Enhanced/crashbash.pkg"
          test -s "$PKG"
          MAGIC="$(od -An -tx1 -N4 "$PKG" | tr -d ' \\n')"
          REVISION="$(od -An -tx1 -j4 -N2 "$PKG" | tr -d ' \\n')"
          printf 'Native lobby PKG magic=%s revision=%s\\n' "$MAGIC" "$REVISION"
          test "$MAGIC" = "7f504b47"
          test "$REVISION" = "8000"
          PKG_ITEM_COUNT="$(python3 - "$PKG" <<'PY'
          import struct, sys
          with open(sys.argv[1], "rb") as stream:
              header = stream.read(0x20)
          if header[:4] != b"\x7fPKG":
              raise SystemExit("Finalized PKG has invalid magic.")
          print(struct.unpack_from(">I", header, 0x14)[0])
          PY
          )"
          VERIFIED_ITEM_COUNT="$(sed -n 's/^PKG item count: \([0-9][0-9]*\) \/ 1024$/\1/p' Crash-Bash-Enhanced/build/PKG-CONTENTS.txt)"
          test "$PKG_ITEM_COUNT" = "$VERIFIED_ITEM_COUNT"
          test "$PKG_ITEM_COUNT" -lt 1024
          PACKAGED_FILES="$(find Crash-Bash-Enhanced/build/pkg/USRDIR/retroarch -type f | wc -l)"
          PACKAGED_BYTES="$(find Crash-Bash-Enhanced/build/pkg/USRDIR/retroarch -type f -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')"
          mkdir -p Crash-Bash-Enhanced/build-artifacts
          cp "$PKG" Crash-Bash-Enhanced/build-artifacts/Crash-Bash-Online-Unified-PS3.pkg
          cp Crash-Bash-Enhanced/build/PKG-CONTENTS.txt Crash-Bash-Enhanced/build-artifacts/PKG-CONTENTS.txt
          cd Crash-Bash-Enhanced/build-artifacts
          sha256sum Crash-Bash-Online-Unified-PS3.pkg > Crash-Bash-Online-Unified-PS3.pkg.sha256
          sha256sum -c Crash-Bash-Online-Unified-PS3.pkg.sha256
          cat > BUILD-MANIFEST.txt <<EOF
          Package: Crash Bash Online — unified PS3 application
          Application ID: CBON00001
          XMB entry: native Tiny3D room lobby (root EBOOT.BIN)
          Embedded runtime: RetroArch + PCSX-ReARMed (USRDIR/retroarch/)
          Embedded runtime files: $PACKAGED_FILES
          Embedded runtime bytes: $PACKAGED_BYTES
          PKG item count: $PKG_ITEM_COUNT / 1024
          Online synchronization: RetroArch Netplay with lockstep and Madrid relay defaults
          Installable packages: one PKG only
          Game disc image and BIOS: not included; provide your own legal BIN/CUE dump and optional BIOS
          EOF
          printf 'PKG SIZE: %s bytes\\n' "$(stat -c %s "$PKG")" >> BUILD-MANIFEST.txt
      - name: Upload single unified PS3 PKG
        uses: actions/upload-artifact@v4
        with:
          name: Crash-Bash-Online-Unified-PS3-PKG
          if-no-files-found: error
          compression-level: 0
          path: |
            Crash-Bash-Enhanced/build-artifacts/Crash-Bash-Online-Unified-PS3.pkg
            Crash-Bash-Enhanced/build-artifacts/Crash-Bash-Online-Unified-PS3.pkg.sha256
            Crash-Bash-Enhanced/build-artifacts/BUILD-MANIFEST.txt
            Crash-Bash-Enhanced/build-artifacts/PKG-CONTENTS.txt

  online-package-build:
    name: Build Crash Bash Online PS3 package (RetroArch Netplay + PCSX-ReARMed)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/02900/ps3-toolchain-tiny3d:latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PS3 toolchain
        run: |
          set -eu
          test -n "$PSL1GHT"
          test -n "$PS3DEV"
          command -v ppu-gcc
          command -v ppu-g++
          command -v spu-gcc
          command -v make_self
          command -v make_self_npdrm
          command -v ppu-nm || command -v nm
          command -v pkg
          command -v package_finalize
          command -v sfo
          command -v git
          command -v wget
          command -v patch
          test -s "$PS3DEV/bin/sfo.xml"
          test -s "$PS3DEV/portlibs/ppu/lib/libz.a"
      - name: Build the online Crash Bash package
        run: bash Crash-Bash-Enhanced/scripts/build_online_pkg_clean.sh
      - name: Verify package checksum
        run: |
          cd Crash-Bash-Enhanced/build-artifacts
          sha256sum -c Crash-Bash-Online-PS3.pkg.sha256
          MAGIC="$(od -An -tx1 -N4 Crash-Bash-Online-PS3.pkg | tr -d ' \\n')"
          REVISION="$(od -An -tx1 -j4 -N2 Crash-Bash-Online-PS3.pkg | tr -d ' \\n')"
          test "$MAGIC" = "7f504b47"
          test "$REVISION" = "8000"
      - name: Upload embedded RetroArch runtime for unified packaging
        uses: actions/upload-artifact@v4
        with:
          name: Crash-Bash-RetroArch-Stage
          if-no-files-found: error
          compression-level: 0
          path: Crash-Bash-Enhanced/build-artifacts/retroarch-stage/USRDIR/retroarch/**
